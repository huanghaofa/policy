  function filtered(){const cutoff=state.days?Date.now()-Number(state.days)*86400000:0;return data.policies.filter(p=>{if(state.view==='favorites'&&!favorites.has(p.id))return false;if(state.field&&!p.fields.includes(state.field))return false;if(state.province&&p.province!==state.province)return false;if(state.city==='_province'&&p.city)return false;if(state.city&&state.city!=='_province'&&p.city!==state.city)return false;if(state.type&&p.type!==state.type)return false;if(cutoff&&(!p.publishedAt||new Date(p.publishedAt+'T23:59:59+08:00').getTime()<cutoff))return false;if(state.q&&!`${p.title} ${p.source} ${p.province} ${p.city} ${p.excerpt||''}`.toLowerCase().includes(state.q.toLowerCase()))return false;if(state.tag&&!p.title.includes(state.tag))return false;if(state.tab==='recent'&&new Date(p.firstSeen).getTime()<Date.now()-7*86400000)return false;return true}).sort((a,b)=>state.sort==='seen'?b.firstSeen.localeCompare(a.firstSeen):(b.publishedAt||'').localeCompare(a.publishedAt||'')||b.firstSeen.localeCompare(a.firstSeen))}

  function rail(){const s=summary(),r=data.runs[0],ratio=n=>`${n/Math.max(s.configured,1)*100}%`;const topRegions=Object.entries(data.policies.reduce((a,p)=>(p.province!=='全国'&&(a[p.province]=(a[p.province]||0)+1),a),{})).sort((a,b)=>b[1]-a[1]).slice(0,8);return `<aside class="rail" aria-label="采集信息"><section class="rail-card"><div class="rail-heading"><h2>第一版静态快照</h2><span>VERSION 1.0</span></div><div class="schedule-time">V1.0<span>全国政策观察</span></div><div class="schedule-line"><span class="dot" style="${data.schedule?.enabled?'':'background:#c5b391'}"></span>官方来源 · 数据快照</div><div class="next-run">数据更新于<strong>${date(data.lastCollectedAt)} · 北京时间</strong></div><button class="mini-link" data-action="settings">查看版本说明${ico('chevron')}</button></section><section class="rail-card"><div class="rail-heading"><h2>官方来源状态</h2><span>SOURCES</span></div><div class="source-metric"><strong>${s.ok}</strong><span>/ ${s.configured} 个启用来源</span></div><div class="progress-track"><span class="progress-good" style="width:${ratio(s.ok)}"></span><span class="progress-empty" style="width:${ratio(s.empty)}"></span><span class="progress-bad" style="width:${ratio(s.failed)}"></span></div><div class="status-legend"><div><i class="legend-dot" style="background:#6d9874"></i>识别政策<b>${s.ok}</b></div><div><i class="legend-dot" style="background:#c4d2b2"></i>未识别到<b>${s.empty}</b></div><div><i class="legend-dot" style="background:#d7b694"></i>失败 / 受限<b>${s.failed}</b></div><div><i class="legend-dot" style="background:#ecf0e7"></i>尚未采集<b>${s.pending}</b></div></div><p class="rail-fine">来源可访问不代表政策已完整采集，识别结果与异常均可核查。</p><button class="mini-link" data-view="sources">管理全部来源${ico('chevron')}</button></section><section class="rail-card coverage-card"><div class="rail-heading"><h2>已收录地区</h2><span>REGIONS</span></div><div class="source-regions">${topRegions.length?topRegions.map(([p,n])=>`<button class="region-chip ${state.province===p?'active':''}" data-region="${esc(p)}">${esc(p)} <span style="opacity:.6">$   function sourceRows(){const all=sourcesFiltered(),size=20;state.sourcePage=Math.min(state.sourcePage,Math.max(1,Math.ceil(all.length/size)));return `<div class="table-wrap"><table class="table"><thead><tr><th>官方来源</th><th>地区 / 领域</th><th>最近采集结果</th><th>识别数</th><th>启用</th></tr></thead><tbody>${all.slice((state.sourcePage-1)*size,state.sourcePage*size).map(s=>{const r=data.sourceStatus[s.id]||{},st=s.enabled===false?'paused':r.status||'pending';return `<tr><td><a class="source-name" href="${safeURL(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.name)} ${ico('external')}</a><a class="source-url" href="${safeURL(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.url)}</a></td><td>${esc(s.province+(s.city?' · '+s.city:''))}<br><span class="pill ${s.field==='综合'?'type':'field-'+fieldClass(s.field)}">${esc(s.field)}</span></td><td><span class="status ${st}">${labels[st]||st}</span><div class="source-message">${esc(r.message||'等待首轮访问验证')}<br>${r.checkedAt?date(r.checkedAt):''}</div></td><td>${number(r.count)}</td><td><button disabled title="静态快照中的来源状态" class="toggle ${s.enabled===false?'':'on'}" data-source-toggle="${esc(s.id)}" aria-label="${s.enabled===false?'启用':'停用'}${esc(s.name)}" aria-pressed="${s.enabled!==false}"></button></td></tr>`}).join('')||'<tr><td colspan="5">没有匹配的来源</td></tr>'}</tbody></table></div>${pagination(all.length,state.sourcePage,size,'source')}`}
  function renderSources(){const s=summary();$('#app').innerHTML=intro('连接政策的源头。','官方来源可追溯，访问异常有记录。','OFFICIAL SOURCE DIRECTORY')+`<div class="note-bar">已配置 ${data.sources.length} 个官方来源，覆盖 ${s.provinces} 个省级地区、${s.cities} 个城市。市级来源持续扩展，当前不代表全国市级全量覆盖。</div><section class="source-filters"><div class="searchbox">${ico('search')}<input id="sourceSearch" value="${esc(state.sourceQ)}" placeholder="查找部门、城市或来源网址" aria-label="搜索来源"></div><select data-source-filter="sourceProvince" aria-label="按来源地区筛选">${option('','全部地区',state.sourceProvince)}${['全国',...data.provinces].map(p=>option(p,p,state.sourceProvince)).join('')}</select><select data-source-filter="sourceField" aria-label="按来源领域筛选">${option('','全部领域',state.sourceField)}${['工信','商务','政府投资基金','综合'].map(p=>option(p,p,state.sourceField)).join('')}</select><select data-source-filter="sourceStatus" aria-label="按采集状态筛选">${option('','全部状态',state.sourceStatus)}${Object.entries(labels).map(([v,l])=>option(v,l,state.sourceStatus)).join('')}</select></section><div id="sourceResults">${sourceRows()}</div><p class="footnote">${ico('info')}优先读取已配置页面及最多两个政策 / 通知栏目，按标题规则提取相关政策线索。动态加载、访问验证及页面改版可能需要逐站适配。</p>`}
  function renderRuns(){$('#app').innerHTML=intro('每一次采集，都有迹可循。','查看真实的采集范围、新增结果与异常记录。','COLLECTION ACTIVITY')+`<div class="note-bar">相同原文链接增量去重。政策发布日期与收录时间分开记录，失败不覆盖历史数据。</div>`+(data.runs.length?data.runs.map((r,i)=>`<article class="run-card"><div><h2>${i===0?'<span class="pill field-industry" style="margin-right:9px">最近一轮</span>':''}${esc(new Date(r.startedAt).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}))}</h2><p>耗时 ${Math.max(1,Math.round((new Date(r.finishedAt)-new Date(r.startedAt))/1000))} 秒 · 扫描 ${r.sources} 个来源${r.scope==='all'?'':' · 指定来源'}<br>${r.empty} 个来源未识别到相关政策 · ${r.paused||0} 个停用 · 采集后累计 ${number(r.total)} 条</p></div><div class="run-numbers"><div><strong>+${r.added}</strong>新增线索</div><div><strong>${r.success}</strong>识别成功</div><div class="failed"><strong>${r.failed}</strong>失败 / 受限</div></div></article>`).join(''):empty('等待第一次采集','点击“立即采集”，开始访问已配置的官方来源。'))+`<p class="footnote">${ico('info')}保留最近 60 轮采集记录。每个来源的具体错误可在“来源管理”中查看。</p>`}
  function render(){renderShell();if(['overview','favorites'].includes(state.view))renderOverview();else if(state.view==='sources')renderSources();else renderRuns();hydrate()}
  function detail(id){const p=data.policies.find(p=>p.id===id);if(!p)return;const dlg=$('#detailDialog');dlg.innerHTML=`<div class="dialog-head"><h2 id="detailHeading">政策详情</h2><button class="icon-button" data-close="detailDialog" aria-label="关闭政策详情">${ico('close')}</button></div><div class="dialog-body"><div class="row-top">${p.fields.map(f=>`<span class="pill field-${fieldClass(f)}">${esc(f)}</span>`).join('')}<span class="pill type">${esc(p.type)}</span></div><h3 class="detail-title">${esc(p.title)}</h3><div class="detail-meta"><div><label>政策地区</label><span>${esc(p.province+(p.city?' · '+p.city:''))}</span></div><div><label>发布日期</label><span>${esc(p.publishedAt||'日期待核')}</span></div><div><label>采集来源</label><span>${esc(p.source)}</span></div><div><label>首次收录</label><span>${date(p.firstSeen)}</span></div><div><label>内容类型</label><span>${esc(p.type)}</span></div><div><label>日期依据</label><span>${esc(p.dateEvidence||'尚未核实')}</span></div></div>${p.excerpt?`<p><strong>源站摘要摘录</strong></p><p>${esc(p.excerpt)}</p>`:''}<div class="evidence-note">此条目来自官方公开页面，分类由标题规则辅助识别。文件效力、申报条件、补助标准及截止日期请打开官方原文核对。${!p.publishedAt?' 当前尚未核实发布日期，不将采集时间作为发布日期。':''}</div><a class="detail-url" href="${safeURL(p.url)}" target="_blank" rel="noopener noreferrer">${esc(p.url)}</a><div class="dialog-actions"><a class="button primary" href="${safeURL(p.url)}" target="_blank" rel="noopener noreferrer">打开官方原文 ${ico('external')}</a><button class="button" data-fav="${esc(p.id)}">${ico('bookmark')}${favorites.has(p.id)?'取消收藏':'收藏政策'}</button><button class="button" data-copy="${esc(p.id)}">复制链接</button></div></div>`;dlg.showModal()}
  function settings(){const dlg=$('#settingsDialog');dlg.innerHTML=`<div class="dialog-head"><h2 id="settingsHeading">版本说明</h2><button class="icon-button" data-close="settingsDialog" aria-label="关闭版本说明">${ico('close')}</button></div><div class="dialog-body"><div class="settings-row"><span>当前版本</span><b>第一版 · V1.0</b></div><div class="settings-row"><span>数据更新于</span><b>${date(data.lastCollectedAt)} · 北京时间</b></div><div class="settings-row"><span>已收录政策线索</span><b>${number(data.policies.length)} 条</b></div><p class="settings-tip">此页面展示当前已发布的政策快照，支持检索、收藏、导出和浏览官方原文。“刷新页面”会重新打开当前发布版本。</p><p class="settings-tip">收藏保存在当前浏览器。来源状态以这份快照的采集结果为准，市级来源为部分覆盖，尚不代表全国全量政策。</p><div class="dialog-actions"><button class="button" data-view="sources" data-close="settingsDialog">查看官方来源</button><button class="button" data-action="backup">导出快照数据</button></div></div>`;dlg.showModal()}
  function addSource(){toast('来源目录展示本次快照的配置')}
  async function post(){throw new Error('此版本为已发布的政策快照')}
  async function collectNow(){location.reload()}
  async function loadState(){return}
  async function pollProgress(){return}
  function download(filename,text,mime){const blob=new Blob([text],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
  function exportCSV(){const rows=filtered();if(!rows.length)return toast('当前筛选下没有可导出的政策');const cell=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"';const heads=['政策标题','领域','省级地区','城市','内容类型','发布日期','日期依据','采集来源','首次收录','官方原文'];const body=[heads,...rows.map(p=>[p.title,p.fields.join('、'),p.province,p.city,p.type,p.publishedAt||'',p.dateEvidence||'',p.source,p.firstSeen,p.url])].map(r=>r.map(cell).join(',')).join('\r\n');download(`全国政策_${new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Shanghai'})}.csv`,'\ufeff'+body,'text/csv;charset=utf-8');toast(`已导出 ${rows.length} 条政策`)}
  function reset(){Object.assign(state,{field:'',province:'',city:'',type:'',days:'',q:'',tag:'',tab:'all',page:1});render()}
  document.addEventListener('click',async e=>{const b=e.target.closest('button,a');if(!b)return;const ds=b.dataset;if(ds.close)$('#'+ds.close).close();if(ds.view){state.view=ds.view;state.page=1;render();window.scrollTo({top:0});return}if(ds.field!==undefined){state.field=state.field===ds.field?'':ds.field;state.page=1;render();return}if(ds.tag!==undefined){state.tag=state.tag===ds.tag?'':ds.tag;state.page=1;render();return}if(ds.region){state.province=state.province===ds.region?'':ds.region;state.city='';state.page=1;render();return}if(ds.tab){state.tab=ds.tab;state.page=1;renderResults();return}if(ds.page){const isSource=ds.kind==='source';state[isSource?'sourcePage':'page']=Number(ds.page);if(isSource)$('#sourceResults').innerHTML=sourceRows();else renderResults();return}if(ds.detail){detail(ds.detail);return}if(ds.fav){const id=ds.fav;favorites.has(id)?favorites.delete(id):favorites.add(id);try{localStorage.setItem('policy-atlas-favorites',JSON.stringify([...favorites]))}catch{toast('浏览器未允许保存，收藏仅本次有效')}if($('#detailDialog').open){$('#detailDialog').close();detail(id)}renderResults();toast(favorites.has(id)?'已加入我的收藏':'已取消收藏');return}if(ds.copy){const p=data.policies.find(p=>p.id===ds.copy);try{await navigator.clipboard.writeText(p.url);toast('已复制官方原文链接')}catch{toast('请从详情页选择并复制原文链接')}return}if(ds.sourceToggle){return}if(ds.action==='collect')return collectNow();if(ds.action==='export')return exportCSV();if(ds.action==='reset')return reset();if(ds.action==='settings')return settings();if(ds.action==='add-source')return addSource();if(ds.action==='backup'){const clean={...data};download('全国政策数据.json',JSON.stringify(clean,null,2),'application/json');toast('已导出政策、来源与采集记录')}});
  let inputTimer;document.addEventListener('input',e=>{if(e.target.id==='policySearch'){state.q=e.target.value;state.page=1;clearTimeout(inputTimer);inputTimer=setTimeout(renderResults,130)}if(e.target.id==='sourceSearch'){state.sourceQ=e.target.value;state.sourcePage=1;clearTimeout(inputTimer);inputTimer=setTimeout(()=>{const target=$('#sourceResults');if(target)target.innerHTML=sourceRows()},130)}});
  document.addEventListener('change',e=>{if(e.target.dataset.filter){state[e.target.dataset.filter]=e.target.value;if(e.target.dataset.filter==='province')state.city='';state.page=1;render()}if(e.target.id==='sortFilter'){state.sort=e.target.value;state.page=1;renderResults()}if(e.target.dataset.sourceFilter){state[e.target.dataset.sourceFilter]=e.target.value;state.sourcePage=1;$('#sourceResults').innerHTML=sourceRows()}});
  document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()}}));
  document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)&&!document.querySelector('dialog[open]')){const input=$('#policySearch')||$('#sourceSearch');if(input){e.preventDefault();input.focus()}}});
  render();hydrate();
  </script>
</body>
</html>
